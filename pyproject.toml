[project]
name = "omnivoice-tts"
version = "1.0.0"
description = "이 PC 의 목소리(OmniVoice 제로샷 클로닝)로 음성 + 자막(SRT) — 목소리 등록부 · 발음 본사전 · 웹 화면 · HTTP API"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
readme = "README.md"
keywords = ["tts", "omnivoice", "voice-cloning", "korean", "srt"]
# torch / torchaudio 는 장치(cuda·cpu·xpu)마다 받는 곳이 달라 setup.bat 이 먼저 설치한다.
dependencies = [
  "omnivoice>=0.2.1",
  "numpy>=1.26",
  "soundfile>=0.12.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
omnivoice-tts = "omnivoice_tts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnivoice_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 실제 모델을 돌리는 느린 테스트 (OMNIVOICE_RUN_SMOKE=1 일 때만)"]
